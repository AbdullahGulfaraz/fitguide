<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Hiệu ứng đổ bóng nền và ánh sáng cam -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1C1C" />
      <stop offset="100%" stop-color="#0E0E0E" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF853E" />
      <stop offset="100%" stop-color="#FF6B1A" />
    </linearGradient>
  </defs>

  <!-- Nền bo góc hiện đại -->
  <rect width="512" height="512" rx="128" fill="url(#bgGradient)" stroke="#303030" stroke-width="12" />

  <!-- Biểu tượng quả tạ FitGuide xoay góc 45 độ năng động -->
  <g transform="translate(256, 256) rotate(-45) translate(-256, -256)">
    <!-- Thanh đòn tạ ở giữa -->
    <rect x="226" y="106" width="60" height="300" rx="12" fill="#E5E5E5" />

    <!-- Cụm bánh tạ bên trên -->
    <rect x="166" y="150" width="180" height="42" rx="14" fill="url(#accentGradient)" />
    <rect x="186" y="96" width="140" height="36" rx="12" fill="#FFFFFF" />

    <!-- Cụm bánh tạ bên dưới -->
    <rect x="166" y="320" width="180" height="42" rx="14" fill="url(#accentGradient)" />
    <rect x="186" y="380" width="140" height="36" rx="12" fill="#FFFFFF" />
  </g>
</svg>
